<div class="bg-[url('/images/LandingPage/LandingPageBg.png')] md:bg-top h-screen">
    <div class="container mx-auto h-full">
        <div class="w-full md:w-2/3 xl:w-1/2 h-full relative">
            <img src="/images/LandingPage/Logo.png" class="absolute" />
            <div
                class="absolute top-1/4 md:top-1/3 left-1/2 -translate-x-1/2 min-w-11/12 md:min-w-3/4 bg-brand-white py-9 px-12 lg:px-24 text-center">
                <app-brand-h3 class="mb-12">Inicia Sesión</app-brand-h3>
                <div class="mb-12">
                    <form [formGroup]="formdata" (ngSubmit)="SubmitHandler($event)">
                        <div class="text-end mb-3">
                            <app-input-line class="w-full text-center" type="email" aria-required="true"
                                formControlName="Email" [Errors]="formdata.get('Email')?.errors">
                                <p class="text-lg text-end">Email</p>
                            </app-input-line>
                        </div>
                        <div class="text-end mb-6">
                            <app-input-line class="w-full text-center" type="password" aria-required="true"
                                formControlName="Password" [Errors]="formdata.get('Password')?.errors">
                                <p class="text-lg text-end">Contraseña</p>
                            </app-input-line>
                        </div>
                        @if(FailedAuthenticationMessage){
                        <p class="text-brand-darkred mb-6"> {{FailedAuthenticationMessage}} </p>
                        }
                        <div class="text-end">
                            <app-brand-primary-button type="submit"
                                anexedclass="px-12">Entrar</app-brand-primary-button>
                        </div>
                    </form>
                </div>
                <app-brand-h3>o continua como invitado aquí</app-brand-h3>
            </div>
        </div>
    </div>
</div>
