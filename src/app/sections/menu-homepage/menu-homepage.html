<div #divDetectorHomePageTopbar class="absolute top-0 h-36 w-full">

</div>
<div [classList]='"absolute top-0 h-36 w-full z-10 animate__animated " + getClassList()'>
    <div class="container mx-auto h-full p-12">
        <div class="flex flex-wrap justify-between h-full">
            <div class="flex-1/4 lg:flex-1/4 xl:flex-1/3 grow-0">
                <img src="images/Resources/Logo_Black.png" class="mb-auto">
            </div>
            <div id="navbar-default" class="mb-auto flex-auto lg:flex-3/4 xl:flex-11/12">
                <div class="flex flex-auto gap-4 lg:gap-6 xl:gap-12 justify-end">
                    <app-menuhomepage-item>Inicio</app-menuhomepage-item>
                    <app-menuhomepage-item-dropdown Label="Ropa" #topbarHomePage>
                        <app-menuhomepage-item AnnexedClasses="!text-sm !lg:text-base">Toda la ropa</app-menuhomepage-item>
                        <app-menuhomepage-item AnnexedClasses="!text-sm !lg:text-base">Vestidos</app-menuhomepage-item>
                        <app-menuhomepage-item AnnexedClasses="!text-sm !lg:text-base">Vestidos Largos</app-menuhomepage-item>
                        <app-menuhomepage-item AnnexedClasses="!text-sm !lg:text-base">Conjuntos</app-menuhomepage-item>
                        <app-menuhomepage-item AnnexedClasses="!text-sm !lg:text-base">Tops + Bottoms</app-menuhomepage-item>
                        <app-menuhomepage-item AnnexedClasses="!text-sm !lg:text-base">Romper</app-menuhomepage-item>
                    </app-menuhomepage-item-dropdown>
                    <app-menuhomepage-item>Colección Verano 2025</app-menuhomepage-item>
                    <app-menuhomepage-item>Buscar</app-menuhomepage-item>
                    <app-menuhomepage-item>Iniciar Sesión</app-menuhomepage-item>
                </div>
            </div>
        </div>
    </div>
</div>
<app-menu [Show]="!ShowHomePageTopBar"></app-menu>
