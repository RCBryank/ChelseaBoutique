<div class="flex">
    <button type="button" class=" bg-brand-black hover:bg-brand-blackdarker border border-black inline-block p-3 py-3 h-full text-brand-white text-lg font-bold cursor-pointer" (click)="IncrementValue(-1)">-</button>
    <input type="number" class="inline-block max-w-24 py-3 bg-white text-center font-calibri text-lg border-y-[1px] border-black appearance-none focus:outline-none" [value]="value"/>
    <button type="button" class=" bg-brand-black hover:bg-brand-blackdarker border border-black inline-block p-3 py-3 text-lg text-brand-white font-bold cursor-pointer" (click)="IncrementValue(1)">+</button>
</div>
