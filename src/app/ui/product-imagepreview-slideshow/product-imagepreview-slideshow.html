<div class="bg-white overflow-hidden">
    <!--Img Prev-->
    <div class="relative w-full h-[768px]">
        <div
            [ngClass]="{'absolute z-10 h-full mask-linear-90 overflow-hidden':true, 'anim-masking-left-to-right':beginAnimation==true}">
            <img [src]="Images[nextImage]" class="w-full h-full" />
        </div>
        <div class="absolute h-full">
            <img [src]="Images[indexImage]" class="w-full h-full" />
        </div>
    </div>
    <!--Bar Imgs-->
    <div class="w-full box-content flex gap-4 py-4 overflow-auto">
        @for (image of Images; track $index) {
        <img [src]="image" class="h-24 cursor-pointer" (click)="HandlerClickImage($index)">
        }
    </div>
</div>
